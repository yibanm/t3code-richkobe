# Builds an unsigned (debug-signed) Android APK for this fork. The production
# keystore requires explicit user confirmation before uploading to CI secrets
# (CLAUDE.md 0.10), so this first version uses the debug key. The app is
# installable and the Chinese UI is fully functional; only the signature differs.
#
# Upstream's mobile workflows all gate on `github.repository == 'pingdotgg/t3code'`
# and require EAS tokens a fork does not have, so this builds locally with
# expo prebuild + gradle on ubuntu-latest, which ships the Android SDK.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [i18n-zh-hans]

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: production
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # actions/checkout runs submodule cleanup even with submodules off, which
          # fails on the orphaned gitlinks in the vendored .repos tree. Do it by hand
          # and sparse-checkout that tree out, as release-desktop.yml does.
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Fall back to the public Clerk identifiers when the vars are unset
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          for name in CLERK_PUBLISHABLE_KEY CLERK_CLI_OAUTH_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "T3CODE_$name=$(env_example "$name")" >> "$GITHUB_ENV"
            fi
          done
          echo "T3CODE_CLERK_JWT_TEMPLATE=t3-relay" >> "$GITHUB_ENV"
          echo "T3CODE_RELAY_URL=https://relay.t3.codes" >> "$GITHUB_ENV"
          echo "T3CODE_TELEMETRY_CHANNEL=dev" >> "$GITHUB_ENV"
          # T3CODE_MOBILE_VERSION feeds app.config.ts so the APK's own versionName
          # matches the artifact filename (both would otherwise diverge).
          version="1.0.0"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "T3CODE_MOBILE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate android directory
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # expo prebuild writes the android/ directory (gitignored). The production
          # variant sets the package to com.richkobe.t3code and the app name to
          # "t3code richkobe" from apps/mobile/app.config.ts.
          EXPO_NO_GIT_STATUS=1 npx expo prebuild --clean --platform android --no-install

      # CLAUDE.md 0.10: releases must carry the project keystore, never the debug
      # key, or users cannot upgrade in place. The plugin reads these variables and
      # falls back to the debug keystore only while the secrets are absent.
      - name: Prepare release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.RICHKOBE_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RICHKOBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RICHKOBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RICHKOBE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_B64" ]]; then
            echo "::warning::RICHKOBE_KEYSTORE_B64 is not set; the APK will be debug-signed and cannot be upgraded in place."
            exit 0
          fi
          keystore="$RUNNER_TEMP/richkobe-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          # The plugin resolves storeFile against the android project, so pass an absolute path.
          {
            echo "T3CODE_ANDROID_KEYSTORE_FILE=$keystore"
            echo "T3CODE_ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "T3CODE_ANDROID_KEY_ALIAS=${KEY_ALIAS:-richkobe}"
            echo "T3CODE_ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          # Without the production keystore in CI secrets, gradle falls back to the
          # debug key. The app installs and runs; only the signature differs.
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          apk=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [[ -n "$apk" ]] || { echo "::error::no APK produced"; exit 1; }
          # reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 → universal, not arm64
          cp "$apk" "dist-release/t3code-richkobe-$BUILD_VERSION-android-universal.apk"
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: t3code-android-apk
          path: dist-release/
          if-no-files-found: error

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$BUILD_VERSION-zh-android"
          # Notes come from CHANGELOG.md, never a hardcoded string (CLAUDE.md 0.10).
          # sub(/\r$/,"") first — CRLF makes exact-match awk silently emit nothing.
          awk -v h="## v$BUILD_VERSION" '
            { sub(/\r$/, "") }
            $0 == h { f = 1; print; next }
            /^## / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::warning::CHANGELOG.md has no ## v$BUILD_VERSION section; falling back to a pointer."
            printf '本版更新日志见仓库 CHANGELOG.md。\n' > notes.md
          fi
          git tag "$tag" 2>/dev/null || git tag -f "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" dist-release/* \
            --title "t3code richkobe v$BUILD_VERSION 简体中文 (Android)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
