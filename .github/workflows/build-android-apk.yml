# Builds an unsigned (debug-signed) Android APK for this fork. The production
# keystore requires explicit user confirmation before uploading to CI secrets
# (CLAUDE.md 0.10), so this first version uses the debug key. The app is
# installable and the Chinese UI is fully functional; only the signature differs.
#
# Upstream's mobile workflows all gate on `github.repository == 'pingdotgg/t3code'`
# and require EAS tokens a fork does not have, so this builds locally with
# expo prebuild + gradle on ubuntu-latest, which ships the Android SDK.
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [i18n-zh-hans]

permissions:
  contents: write

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_VARIANT: production
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # actions/checkout runs submodule cleanup even with submodules off, which
          # fails on the orphaned gitlinks in the vendored .repos tree. Do it by hand
          # and sparse-checkout that tree out, as release-desktop.yml does.
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Fall back to the public Clerk identifiers when the vars are unset
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          for name in CLERK_PUBLISHABLE_KEY CLERK_CLI_OAUTH_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "T3CODE_$name=$(env_example "$name")" >> "$GITHUB_ENV"
            fi
          done
          echo "T3CODE_CLERK_JWT_TEMPLATE=t3-relay" >> "$GITHUB_ENV"
          echo "T3CODE_RELAY_URL=https://relay.t3.codes" >> "$GITHUB_ENV"
          echo "T3CODE_TELEMETRY_CHANNEL=dev" >> "$GITHUB_ENV"
          # A -preview.<date>.<n> version keeps reruns on one day from colliding.
          # T3CODE_MOBILE_VERSION feeds app.config.ts so the APK's own versionName
          # matches the artifact filename (both would otherwise diverge).
          version="2.3.0-preview.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER"
          echo "BUILD_VERSION=$version" >> "$GITHUB_ENV"
          echo "T3CODE_MOBILE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          install-args: --filter=@t3tools/mobile... --filter=@t3tools/scripts...

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Generate android directory
        working-directory: apps/mobile
        shell: bash
        run: |
          set -euo pipefail
          # expo prebuild writes the android/ directory (gitignored). The production
          # variant sets the package to com.richkobe.t3code and the app name to
          # "t3code richkobe" from apps/mobile/app.config.ts.
          EXPO_NO_GIT_STATUS=1 npx expo prebuild --clean --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        shell: bash
        run: |
          set -euo pipefail
          # Without the production keystore in CI secrets, gradle falls back to the
          # debug key. The app installs and runs; only the signature differs.
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          apk=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" | head -1)
          [[ -n "$apk" ]] || { echo "::error::no APK produced"; exit 1; }
          # Names follow the convention: <name>-<version>-<platform>-<arch>.<ext>
          cp "$apk" "dist-release/t3code-richkobe-$BUILD_VERSION-android-arm64.apk"
          ls -la dist-release/

      - uses: actions/upload-artifact@v4
        with:
          name: t3code-android-apk
          path: dist-release/
          if-no-files-found: error

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$BUILD_VERSION-zh-android"
          git tag "$tag"
          gh release create "$tag" dist-release/* \
            --title "T3 Code $BUILD_VERSION 简体中文 (Android)" \
            --notes "简体中文界面，可在 设置 → 语言 切换中文/英文。Debug 签名（release 主密钥待确认后补签名）。" \
            --target "$GITHUB_SHA"
