# Builds an unsigned Windows installer for this fork. The upstream release
# workflow needs 26 secrets (GitHub App publish, Azure signing, Apple, Vercel)
# that a fork does not have, so this is the smallest path that produces an .exe:
# a preview version string makes build-desktop-artifact.ts set publish to null,
# the public identifiers come from .env.example, and reuse-resource-monitor skips
# the Rust/MSVC (Spectre) prerequisite probe the way the upstream Linux job does.
#
# Runs on Linux and cross-compiles, exactly like the upstream Windows job: the
# app-builder-lib patch lets it read the uninstaller without wine.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [i18n-zh-hans]

permissions:
  contents: write

env:
  RUST_TARGET: x86_64-pc-windows-msvc

jobs:
  build:
    name: Windows x64 installer
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Public identifiers, not secrets; the same ones official preview builds bake in.
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.T3CODE_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: t3-relay
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.T3CODE_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: https://relay.t3.codes
      T3CODE_TELEMETRY_CHANNEL: dev
    steps:
      - name: Checkout
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          # actions/checkout runs submodule cleanup even with submodules off, which
          # fails on the orphaned gitlinks in the vendored .repos tree. Do it by hand
          # and sparse-checkout that tree out, as release-desktop.yml does.
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA"
          git sparse-checkout set --no-cone '/*' '!/.repos/'
          git -c checkout.workers=0 checkout --detach FETCH_HEAD

      - name: Fall back to the public Clerk identifiers when the vars are unset
        shell: bash
        run: |
          set -euo pipefail
          env_example() { sed -n "s|^T3CODE_$1=||p" .env.example; }
          for name in CLERK_PUBLISHABLE_KEY CLERK_CLI_OAUTH_CLIENT_ID; do
            if [[ -z "${!name:-}" ]]; then
              echo "T3CODE_$name=$(env_example "$name")" >> "$GITHUB_ENV"
            fi
          done
          # T3CODE_DESKTOP_UPDATE_REPOSITORY without a slash makes
          # resolveGitHubPublishConfig return undefined, so electron-builder writes no
          # updater feed and needs no GitHub App credential. Without it a release
          # version would make the build try to publish to pingdotgg/t3code.
          echo "T3CODE_DESKTOP_UPDATE_REPOSITORY=disabled" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=1.0.0" >> "$GITHUB_ENV"

      - name: Setup dependencies
        uses: ./.github/actions/setup-ci-deps
        with:
          # web builds the desktop renderer; the `...` suffix on desktop does not
          # pull it in because web is not a workspace dependency of desktop.
          install-args: --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.RUST_TARGET }}

      - name: Install cargo-xwin
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-xwin@0.23.1

      - name: Build resource monitor
        shell: bash
        run: cargo xwin build --locked --release --manifest-path native/resource-monitor/Cargo.toml --target "$RUST_TARGET"

      - name: Build JS bundle
        shell: bash
        run: vp run build:desktop:bundle

      # Names follow the release convention: <name>-<version>-<platform>-<arch>.<ext>.
      # Each build is collected right after it runs, so a later build that clears
      # release/ cannot lose an earlier artifact.
      - name: Build installer and collect it
        shell: bash
        env:
          # Skips the Rust and MSVC prerequisite probes, which look for Spectre
          # libraries this job does not need now that the monitor binary exists.
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          node scripts/build-desktop-artifact.ts \
            --platform win --target nsis --arch x64 \
            --build-version "$BUILD_VERSION" --skip-build --verbose
          mkdir -p dist-release
          setup=$(ls release/*-x64.exe 2>/dev/null | head -1)
          [[ -n "$setup" ]] || { echo "::error::no installer produced"; exit 1; }
          cp "$setup" "dist-release/t3code-richkobe-$BUILD_VERSION-windows-x64-setup.exe"

      - name: Build portable zip and collect it
        shell: bash
        env:
          T3CODE_DESKTOP_REUSE_RESOURCE_MONITOR: "true"
        run: |
          set -euo pipefail
          # Reuses the JS bundle from the first call, so this only re-packages.
          node scripts/build-desktop-artifact.ts \
            --platform win --target zip --arch x64 \
            --build-version "$BUILD_VERSION" --skip-build --verbose
          portable=$(ls release/*-x64.zip 2>/dev/null | head -1)
          [[ -n "$portable" ]] || { echo "::error::no portable zip produced"; exit 1; }
          cp "$portable" "dist-release/t3code-richkobe-$BUILD_VERSION-windows-x64-portable.zip"

      - name: List assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist-release/
          # A preview build has no updater feed, so blockmaps and latest*.yml must
          # not ship: they would let a stable install update onto this build.
          [[ $(ls dist-release/ | wc -l) -eq 2 ]] || { echo "::error::expected exactly 2 assets"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: t3code-windows-x64
          path: dist-release/
          if-no-files-found: error

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v$BUILD_VERSION-zh"
          # Release notes come from CHANGELOG.md, never a string hardcoded here
          # (CLAUDE.md 0.10 + the awk/\r pitfall in the global log).
          # sub(/\r$/,"") first — CRLF makes exact-match awk silently emit nothing.
          awk -v h="## v$BUILD_VERSION" '
            { sub(/\r$/, "") }
            $0 == h { f = 1; print; next }
            /^## / { f = 0 }
            f
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::warning::CHANGELOG.md has no ## v$BUILD_VERSION section; falling back to a pointer."
            printf '本版更新日志见仓库 CHANGELOG.md。\n' > notes.md
          fi
          # Idempotent: a rerun on the same version must not fail on an existing tag.
          git tag "$tag" 2>/dev/null || git tag -f "$tag"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --yes --cleanup-tag
          fi
          gh release create "$tag" dist-release/* \
            --title "t3code richkobe v$BUILD_VERSION (简体中文)" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"
